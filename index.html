 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registration Form</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1>WELCOME ALL</h1>
  <div class="form-container">
    <h2>Registration Form</h2>
    <form novalidate>
      <div class="form-group">
        <label for="name">Enter your name</label>
        <input type="text" id="name" name="name" placeholder="Your name" required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Minimum 6 characters" minlength="6" required />
      </div>

      <div class="form-group">
        <label for="email">E-mail id</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required />
      </div>

      <div class="form-group">
        <label for="mobile">Mobile number</label>
        <input type="tel" id="mobile" name="mobile" placeholder="Enter 10-digit mobile number" minlength="10" maxlength="10" pattern="[0-9]{10}" required />
      </div>

      <button type="submit">Submit</button>
      <button type="button" class="run-tests-button" id="load-student">Load Student Data</button>
      <div class="message"></div>
      <div class="test-result"></div>
    </form>
  </div>
 
  <script src="script.js"></script>
  <script src="test.js" type="module"></script>
</body>
</html>
